type: track
title: "Chainguard Images: Hands-On Security Workshop"
teaser: Learn to use Chainguard Images to eliminate CVEs, verify provenance, and build secure container pipelines.
description: |
  In this hands-on workshop you will:
  - Pull and compare Chainguard Images against public alternatives
  - Scan images for CVEs using Grype and Trivy
  - Verify image signatures and SBOM attestations with Cosign
  - Build multi-stage Docker images using Chainguard Python
  - Convert existing Dockerfiles with the dfc tool
  - Explore Wolfi packages with apk

  You will need a Chainguard organization. Your organization name and a pull token
  are provided as environment variables in the sandbox.
